name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Apply D1 migrations
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute innovation-localgov --remote --file=migrations/0001_init.sql

      - name: Sync Pages secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          SEARCH_PROVIDER: ${{ vars.SEARCH_PROVIDER }}
        run: |
          set -e
          put() { if [ -n "$2" ]; then echo "$2" | npx wrangler pages secret put "$1" --project-name=innovation-localgov; fi; }
          put DEEPSEEK_API_KEY "$DEEPSEEK_API_KEY"
          put FIREWORKS_API_KEY "$FIREWORKS_API_KEY"
          put AUTH_SECRET "$AUTH_SECRET"
          put SEARCH_API_KEY "$SEARCH_API_KEY"
          put LLM_PROVIDER "$LLM_PROVIDER"
          put SEARCH_PROVIDER "$SEARCH_PROVIDER"
          echo "secrets synced"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=innovation-localgov
