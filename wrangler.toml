# Cloudflare Pages 配置
name = "innovation-localgov"
compatibility_date = "2026-10-01"
pages_build_output_dir = "dist"

# D1 与 KV 绑定
# 本地开发：id 用占位值即可，wrangler 只在 --remote 时校验真实 ID
# 上线：换成 `wrangler d1 create` 与 `wrangler kv namespace create` 返回的真实值
[[d1_databases]]
binding = "DB"
database_name = "innovation-localgov"
database_id = "e2d2dffd-33f5-4c0f-b03f-917bbc234f8f"

[[kv_namespaces]]
binding = "SESSIONS"
id = "5d5ae80ea4944ab7b54988ebf1cc850f"

[vars]
SITE_ORIGIN = "https://innovation.jinhuazhang.top"
# 检索未接入前保持 none；接入后改为 tavily / serper / brave
SEARCH_PROVIDER = "none"
