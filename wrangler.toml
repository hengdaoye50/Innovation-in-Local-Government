# Cloudflare Pages 配置
name = "innovation-localgov"
compatibility_date = "2025-01-01"
pages_build_output_dir = "dist"

# D1 与 KV 的绑定
# 本地开发：database_id 用占位值即可，wrangler 只在 --remote 时校验真实 ID
# 上线前把 database_id 换成 `wrangler d1 create innovation-localgov` 返回的真实值
[[d1_databases]]
binding = "DB"
database_name = "innovation-localgov"
database_id = "00000000-0000-0000-0000-000000000000"

[[kv_namespaces]]
binding = "SESSIONS"
id = "00000000000000000000000000000000"

[vars]
SITE_ORIGIN = "http://localhost:4184"
SEARCH_PROVIDER = "none"
