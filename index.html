<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>地方政府创新案例库 · MPA 课程协作平台</title>
    <meta
      name="description"
      content="面向 MPA 与行政管理专业的课程协作平台：从公开新闻出发，与大模型协同检索、撰写地方政府创新案例梗概，按发生地汇集于中国地图。"
    />
    <meta name="theme-color" content="#FDF8F0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --paper: #fdf8f0;
        --ink: #2c2c2c;
        --plum: #7e0c6e;
        --gold: #c4a265;
      }
      html {
        background: var(--paper);
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--paper);
        z-index: 9999;
        transition: opacity 0.45s cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      #boot[hidden] {
        display: none;
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      #boot .mark {
        font: 500 13px/1 Georgia, "Songti SC", serif;
        letter-spacing: 0.32em;
        color: var(--plum);
        text-transform: uppercase;
        text-align: center;
      }
      #boot .rule {
        width: 128px;
        height: 1px;
        margin-top: 18px;
        background: rgba(126, 12, 110, 0.14);
        overflow: hidden;
      }
      #boot .rule::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        background: var(--gold);
        animation: bootslide 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes bootslide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(360%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .rule::after {
          animation: none;
          width: 100%;
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div>
        <div class="mark">Local Governance Innovation</div>
        <div class="rule"></div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
